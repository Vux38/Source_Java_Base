spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

  jpa:
    ddl-auto: validate
    show-sql: false

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never

logging:
  level:
    root: WARN
    com.vux38: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info