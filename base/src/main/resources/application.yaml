spring:
  application:
    name: base

  # ============================================
  # DATABASE - BẢO MẬT
  # ============================================
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/portfolio_db}
    username: ${DB_USER:dev_user}
    password: ${DB_PASSWORD:change_me}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_MAX_POOL:10}
      minimum-idle: ${DB_MIN_IDLE:2}
      connection-timeout: 30000

  # ============================================
  # JPA
  # ============================================
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # ============================================
  # FLYWAY
  # ============================================
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # ============================================
  # REDIS
  # ============================================
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000

  # ============================================
  # CACHE
  # ============================================
  cache:
    type: redis

  # ============================================
  # JACKSON
  # ============================================
  jackson:
    serialization:
      write-dates-as-timestamps: false
      write-null-map-values: false
    deserialization:
      fail-on-unknown-properties: true
    default-property-inclusion: non_null

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:default}
  api-key: ${CLOUDINARY_API_KEY:default}
  api-secret: ${CLOUDINARY_API_SECRET:default}

# ============================================
# CACHE CONFIG
# ============================================
app:
  cache:
    default-ttl-seconds: 300

# ============================================
# RATE LIMIT
# ============================================
rate-limit:
  capacity: ${RATE_LIMIT_CAPACITY:100}
  refill: ${RATE_LIMIT_REFILL:50}
  refill-duration: ${RATE_LIMIT_REFILL_DURATION:60}

# ============================================
# SERVER
# ============================================
server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false
  compression:
    enabled: true
    mime-types: >
      text/html,
      text/xml,
      text/plain,
      text/css,
      text/javascript,
      application/javascript,
      application/json

# ============================================
# ACTUATOR
# ============================================
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

# ============================================
# LOGGING
# ============================================
logging:
  level:
    root: WARN
    com.vux38: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: ERROR
  pattern:
    console: "%d{HH:mm:ss} %-5level %logger{36} - %msg%n"

JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:604800000} # 7 days