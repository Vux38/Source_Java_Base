server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: auth-project

  # H2 In-memory Database (dev/test)
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:base}?user=${DB_USER:root}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# JWT Configuration
jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
  access-token-expiration: 86400000       # 24 hours (ms)
  refresh-token-expiration: 604800000     # 7 days (ms)

# Logging
logging:
  level:
    com.auth.project: DEBUG
    org.springframework.security: DEBUG
